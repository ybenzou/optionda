[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optionda"
version = "0.1.7"
description = "Terminal options desk: freeze IV, reprice on live spot (Yahoo or Alpaca)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Yuanben" }]
keywords = ["options", "black-scholes", "cli", "alpaca", "yfinance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "httpx>=0.27",
  "plotext>=5.2",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
viz = ["plotly>=5.18"]

[project.scripts]
optionda = "optionda.cli:main"

[project.urls]
Homepage = "https://github.com/ybenzou/optionda"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
